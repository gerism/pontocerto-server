<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — PontoCerto</title>
<style>
  body {
    background: #0f1115;
    color: #f3ede4;
    font-family: -apple-system, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .card {
    background: #1a1d24;
    border: 1px solid #2c3038;
    border-radius: 16px;
    padding: 28px;
    max-width: 780px;
    width: 100%;
  }
  h1 { font-size: 20px; margin: 0 0 20px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  .tab {
    flex: 1;
    min-width: 100px;
    padding: 10px;
    text-align: center;
    border-radius: 10px;
    background: #0f1115;
    border: 1px solid #2c3038;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    color: #9a9ba3;
  }
  .tab.active { background: #ff6a3d; color: #1a0f14; border-color: #ff6a3d; }
  .painel { display: none; }
  .painel.active { display: block; }
  label { display: block; font-size: 13px; margin: 16px 0 6px; color: #9a9ba3; }
  input, select {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid #2c3038;
    background: #0f1115;
    color: #f3ede4;
    font-size: 15px;
    box-sizing: border-box;
    font-family: inherit;
  }
  button.acao {
    width: 100%;
    margin-top: 22px;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: #ff6a3d;
    color: #1a0f14;
    font-weight: 800;
    font-size: 14.5px;
    cursor: pointer;
  }
  button.acao:disabled { opacity: 0.6; }
  #resultadoCriar, #resultadoInscritos { margin-top: 18px; font-size: 13.5px; line-height: 1.6; }
  .ok { color: #4ade80; }
  .erro { color: #f87171; }

  .evento-item {
    background: #0f1115;
    border: 1px solid #2c3038;
    border-radius: 10px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
  }
  .evento-item:hover { border-color: #ff6a3d; }
  .evento-item.selecionado { border-color: #ff6a3d; background: #201a16; }
  .evento-nome { font-weight: 700; font-size: 14px; }
  .evento-meta { color: #9a9ba3; font-size: 11.5px; margin-top: 3px; }
  .evento-badge {
    display: inline-block;
    font-size: 10.5px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    margin-left: 8px;
  }
  .btn-excluir-evento {
    background: none;
    border: 1px solid #f87171;
    color: #f87171;
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 11px;
    font-weight: 700;
    cursor: pointer;
    float: right;
    margin-top: -4px;
  }
  .btn-excluir-evento:hover { background: #f87171; color: #1a0f14; }
  .badge-ativo { background: #4ade8033; color: #4ade80; }
  .badge-encerrado { background: #f8717133; color: #f87171; }

  .filtros-row { display: flex; gap: 10px; margin-top: 16px; }
  .filtros-row > div { flex: 1; }

  table { width: 100%; border-collapse: collapse; margin-top: 16px; font-size: 12.5px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #2c3038; }
  th { color: #9a9ba3; font-size: 11px; text-transform: uppercase; }

  .categoria-linha {
    display: flex;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .categoria-linha input { flex: 1; }
  .categoria-linha input.idade { max-width: 70px; }
  .btn-remover-cat {
    background: none;
    border: 1px solid #f87171;
    color: #f87171;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🏁 Admin — PontoCerto</h1>

    <div class="tabs">
      <div class="tab active" id="tabCriar" onclick="mudarAba('criar')">➕ Criar evento</div>
      <div class="tab" id="tabInscritos" onclick="mudarAba('inscritos')">📋 Ver inscritos</div>
      <div class="tab" id="tabResultados" onclick="mudarAba('resultados')">🏆 Resultados</div>
      <div class="tab" id="tabSimular" onclick="mudarAba('simular')">🧪 Simular RFID</div>
    </div>

    <!-- ABA: CRIAR EVENTO -->
    <div class="painel active" id="painelCriar">
      <label>Senha</label>
      <input type="password" id="senhaCriar" placeholder="Senha do painel">

      <label>Nome do evento *</label>
      <input type="text" id="nomeCriar" placeholder="Ex: Corrida de Cláudio 2026">

      <label>Código do evento *</label>
      <input type="text" id="codigoCriar" placeholder="Ex: CLD2026" style="text-transform:uppercase;">

      <label>Data da corrida *</label>
      <input type="date" id="dataCriar">

      <label>Valor da inscrição (R$) *</label>
      <input type="number" id="valorCriar" placeholder="Ex: 50.00" step="0.01">

      <label>Categorias por idade *</label>
      <div id="listaCategorias"></div>
      <button type="button" class="acao" style="margin-top:8px; background:#1a1d24; color:#f3ede4; border:1px solid #2c3038;" onclick="adicionarCategoria()">+ Adicionar faixa de idade</button>

      <button class="acao" id="btnCriar" onclick="criarEvento()">Criar evento</button>

      <div id="resultadoCriar"></div>
    </div>

    <!-- ABA: VER INSCRITOS -->
    <div class="painel" id="painelInscritos">
      <label>Senha</label>
      <input type="password" id="senhaInscritos" placeholder="Senha do painel">
      <button class="acao" style="margin-top:14px;" onclick="carregarEventos()">🔄 Carregar eventos</button>

      <div id="listaEventos" style="margin-top:16px;"></div>

      <div id="filtrosBox" style="display:none;">
        <div class="filtros-row">
          <div>
            <label>Idade mínima</label>
            <input type="number" id="faixaMin" placeholder="Ex: 18">
          </div>
          <div>
            <label>Idade máxima</label>
            <input type="number" id="faixaMax" placeholder="Ex: 29">
          </div>
        </div>
        <label>Sexo</label>
        <select id="filtroSexo">
          <option value="">Todos</option>
          <option value="M">Masculino</option>
          <option value="F">Feminino</option>
        </select>

        <button class="acao" onclick="carregarInscritos()">Filtrar inscritos</button>
      </div>

      <div id="resultadoInscritos"></div>
    </div>
    <!-- ABA: DENÚNCIAS removida — não se aplica ao PontoCerto -->

    <!-- ABA: RESULTADOS -->
    <div class="painel" id="painelResultados">
      <label>Senha</label>
      <input type="password" id="senhaResultados" placeholder="Senha do painel">
      <button class="acao" style="margin-top:14px;" onclick="carregarEventosResultados()">🔄 Carregar eventos</button>

      <div id="listaEventosResultados" style="margin-top:16px;"></div>
      <div id="resultadoResultados"></div>
    </div>
    <!-- ABA: SIMULAR RFID (testes sem hardware) -->
    <div class="painel" id="painelSimular">
      <p style="color:#9a9ba3; font-size:12.5px; line-height:1.6; margin-bottom:16px;">
        Digite um código qualquer pra simular a tag (ex: "TESTE001") — sem precisar de leitor ou antena de verdade. Serve pra testar o fluxo completo antes do RFID chegar.
      </p>

      <label>Senha</label>
      <input type="password" id="senhaSimular" placeholder="Senha do painel">

      <label>Evento</label>
      <div id="listaEventosSimular" style="margin-top:8px;"></div>
      <button class="acao" style="margin-top:8px; background:#1a1d24; color:#f3ede4; border:1px solid #2c3038;" onclick="carregarEventosSimular()">🔄 Carregar eventos</button>

      <label>Nº do inscrito (veja em "Ver inscritos")</label>
      <input type="number" id="inscricaoIdSimular" placeholder="Ex: 1">

      <label>Código da tag (fictício)</label>
      <input type="text" id="tagSimular" placeholder="Ex: TESTE001">

      <button class="acao" onclick="vincularTagSimulada()">Vincular tag ao inscrito</button>

      <div style="height:1px; background:#2c3038; margin:24px 0;"></div>

      <label>Modo de leitura</label>
      <select id="modoSimular">
        <option value="largada">Largada</option>
        <option value="chegada">Chegada</option>
      </select>

      <label>Código da tag lida</label>
      <input type="text" id="tagLeituraSimular" placeholder="Ex: TESTE001">

      <button class="acao" onclick="simularLeitura()">Simular leitura da tag</button>

      <div id="resultadoSimular"></div>
    </div>
  </div>

<script>
let eventoSelecionadoId = null;
let contadorCategoria = 0;

function mudarAba(aba) {
  document.getElementById('tabCriar').classList.toggle('active', aba === 'criar');
  document.getElementById('tabInscritos').classList.toggle('active', aba === 'inscritos');
  document.getElementById('tabResultados').classList.toggle('active', aba === 'resultados');
  document.getElementById('tabSimular').classList.toggle('active', aba === 'simular');
  document.getElementById('painelCriar').classList.toggle('active', aba === 'criar');
  document.getElementById('painelInscritos').classList.toggle('active', aba === 'inscritos');
  document.getElementById('painelResultados').classList.toggle('active', aba === 'resultados');
  document.getElementById('painelSimular').classList.toggle('active', aba === 'simular');
}

function adicionarCategoria(nome = '', min = '', max = '') {
  contadorCategoria++;
  const id = `cat${contadorCategoria}`;
  const div = document.createElement('div');
  div.className = 'categoria-linha';
  div.id = id;
  div.innerHTML = `
    <input type="text" class="cat-nome" placeholder="Ex: 15 a 20 anos" value="${nome}">
    <input type="number" class="cat-min idade" placeholder="Min" value="${min}">
    <input type="number" class="cat-max idade" placeholder="Max" value="${max}">
    <button type="button" class="btn-remover-cat" onclick="document.getElementById('${id}').remove()">✕</button>
  `;
  document.getElementById('listaCategorias').appendChild(div);
}

// já começa com uma linha em branco pra facilitar
adicionarCategoria();

function coletarCategorias() {
  const linhas = document.querySelectorAll('.categoria-linha');
  const categorias = [];
  for (const linha of linhas) {
    const nome = linha.querySelector('.cat-nome').value.trim();
    const idade_min = parseInt(linha.querySelector('.cat-min').value, 10);
    const idade_max = parseInt(linha.querySelector('.cat-max').value, 10);
    if (nome && !isNaN(idade_min) && !isNaN(idade_max)) {
      categorias.push({ nome, idade_min, idade_max });
    }
  }
  return categorias;
}

async function criarEvento() {
  const senha = document.getElementById('senhaCriar').value.trim();
  const nome = document.getElementById('nomeCriar').value.trim();
  const codigo = document.getElementById('codigoCriar').value.trim().toUpperCase();
  const data_evento = document.getElementById('dataCriar').value;
  const valor_inscricao = document.getElementById('valorCriar').value;
  const categorias = coletarCategorias();
  const resultado = document.getElementById('resultadoCriar');
  const btn = document.getElementById('btnCriar');

  if (!senha || !nome || !codigo || !data_evento || !valor_inscricao) {
    resultado.innerHTML = '<span class="erro">Preenche todos os campos obrigatórios.</span>';
    return;
  }
  if (categorias.length === 0) {
    resultado.innerHTML = '<span class="erro">Adiciona pelo menos uma categoria de idade válida.</span>';
    return;
  }

  btn.disabled = true;
  resultado.textContent = 'Criando...';

  try {
    const resp = await fetch('/admin/eventos', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, nome, codigo, data_evento, valor_inscricao, categorias })
    });
    const dados = await resp.json();

    if (resp.ok) {
      resultado.innerHTML = `<span class="ok">✅ Evento "${dados.nome}" criado! Código: <b>${dados.codigo}</b></span>`;
      document.getElementById('nomeCriar').value = '';
      document.getElementById('codigoCriar').value = '';
      document.getElementById('dataCriar').value = '';
      document.getElementById('valorCriar').value = '';
      document.getElementById('listaCategorias').innerHTML = '';
      adicionarCategoria();
    } else {
      resultado.innerHTML = `<span class="erro">❌ ${dados.erro || 'Não foi possível criar.'}</span>`;
    }
  } catch (e) {
    resultado.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  } finally {
    btn.disabled = false;
  }
}

async function carregarEventos() {
  const senha = document.getElementById('senhaInscritos').value.trim();
  const container = document.getElementById('listaEventos');
  if (!senha) {
    container.innerHTML = '<span class="erro">Preenche a senha.</span>';
    return;
  }

  container.textContent = 'Carregando...';

  try {
    const resp = await fetch('/admin/eventos/listar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    const eventos = await resp.json();

    if (!resp.ok) {
      container.innerHTML = `<span class="erro">❌ ${eventos.erro || 'Erro ao carregar.'}</span>`;
      return;
    }

    if (eventos.length === 0) {
      container.innerHTML = '<span style="color:#9a9ba3;">Nenhum evento criado ainda.</span>';
      return;
    }

    container.innerHTML = eventos.map(e => `
      <div class="evento-item" onclick="selecionarEvento(${e.id}, this)">
        <button class="btn-excluir-evento" onclick="event.stopPropagation(); excluirEvento(${e.id}, '${e.nome.replace(/'/g, "\\'")}')">🗑️</button>
        <div class="evento-nome">${e.nome}
          <span class="evento-badge ${e.ativo ? 'badge-ativo' : 'badge-encerrado'}">${e.ativo ? 'ABERTO' : 'ENCERRADO'}</span>
        </div>
        <div class="evento-meta">${e.codigo} · ${new Date(e.data_evento).toLocaleDateString('pt-BR')} · ${e.total_pagos} pago(s)</div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  }
}

async function excluirEvento(id, nome) {
  const senha = document.getElementById('senhaInscritos').value.trim();
  if (!senha) {
    alert('Preenche a senha antes de excluir.');
    return;
  }
  if (!confirm(`Tem certeza que quer excluir "${nome}"?\n\nIsso apaga o evento, suas categorias e todas as inscrições dele. Não pode ser desfeito.`)) return;

  try {
    const resp = await fetch(`/admin/eventos/${id}/excluir`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    const dados = await resp.json();

    if (resp.ok) {
      alert(`"${dados.nome}" foi excluído.`);
      carregarEventos();
    } else {
      alert(`❌ ${dados.erro || 'Não foi possível excluir.'}`);
    }
  } catch (e) {
    alert('❌ Erro de conexão com o servidor.');
  }
}

function selecionarEvento(id, elemento) {
  eventoSelecionadoId = id;
  document.querySelectorAll('.evento-item').forEach(el => el.classList.remove('selecionado'));
  elemento.classList.add('selecionado');
  document.getElementById('filtrosBox').style.display = 'block';
  carregarInscritos();
}

async function carregarInscritos() {
  if (!eventoSelecionadoId) return;
  const senha = document.getElementById('senhaInscritos').value.trim();
  const faixa_min = document.getElementById('faixaMin').value || undefined;
  const faixa_max = document.getElementById('faixaMax').value || undefined;
  const sexo = document.getElementById('filtroSexo').value || undefined;
  const resultado = document.getElementById('resultadoInscritos');

  resultado.textContent = 'Carregando...';

  try {
    const resp = await fetch(`/admin/eventos/${eventoSelecionadoId}/inscritos`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, faixa_min, faixa_max, sexo })
    });
    const inscritos = await resp.json();

    if (!resp.ok) {
      resultado.innerHTML = `<span class="erro">❌ ${inscritos.erro || 'Erro ao carregar.'}</span>`;
      return;
    }

    if (inscritos.length === 0) {
      resultado.innerHTML = '<span style="color:#9a9ba3;">Nenhum inscrito pago com esse filtro.</span>';
      return;
    }

    resultado.innerHTML = `
      <table>
        <tr><th>Nº</th><th>Nome</th><th>Idade</th><th>Categoria</th><th>Sexo</th><th>Tag</th></tr>
        ${inscritos.map(i => `
          <tr>
            <td>${i.inscricao_id}</td>
            <td>${i.nome}</td>
            <td>${i.idade}</td>
            <td>${i.categoria_nome || '⚠️ sem categoria'}</td>
            <td>${i.sexo || '-'}</td>
            <td>${i.tag_epc || '⚠️ sem tag'}</td>
          </tr>
        `).join('')}
      </table>
      <div style="margin-top:10px; color:#9a9ba3;">${inscritos.length} inscrito(s) encontrado(s)</div>
    `;
  } catch (e) {
    resultado.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  }
}

// ============================================
// RESULTADOS (ranking geral + por categoria)
// ============================================
let eventoSelecionadoResultados = null;

async function carregarEventosResultados() {
  const senha = document.getElementById('senhaResultados').value.trim();
  const container = document.getElementById('listaEventosResultados');
  if (!senha) {
    container.innerHTML = '<span class="erro">Preenche a senha.</span>';
    return;
  }
  container.textContent = 'Carregando...';

  try {
    const resp = await fetch('/admin/eventos/listar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    const eventos = await resp.json();

    if (!resp.ok) {
      container.innerHTML = `<span class="erro">❌ ${eventos.erro || 'Erro ao carregar.'}</span>`;
      return;
    }
    if (eventos.length === 0) {
      container.innerHTML = '<span style="color:#9a9ba3;">Nenhum evento criado ainda.</span>';
      return;
    }

    container.innerHTML = eventos.map(e => `
      <div class="evento-item" onclick="selecionarEventoResultados(${e.id}, this)">
        <div class="evento-nome">${e.nome}
          <span class="evento-badge ${e.ativo ? 'badge-ativo' : 'badge-encerrado'}">${e.ativo ? 'ABERTO' : 'ENCERRADO'}</span>
        </div>
        <div class="evento-meta">${e.codigo} · ${new Date(e.data_evento).toLocaleDateString('pt-BR')} · ${e.total_pagos} pago(s)</div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  }
}

function selecionarEventoResultados(id, elemento) {
  eventoSelecionadoResultados = id;
  document.querySelectorAll('#listaEventosResultados .evento-item').forEach(el => el.classList.remove('selecionado'));
  elemento.classList.add('selecionado');
  carregarResultados();
}

async function carregarResultados() {
  if (!eventoSelecionadoResultados) return;
  const senha = document.getElementById('senhaResultados').value.trim();
  const resultado = document.getElementById('resultadoResultados');
  resultado.textContent = 'Calculando resultados...';

  try {
    const resp = await fetch(`/admin/eventos/${eventoSelecionadoResultados}/resultados`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    const dados = await resp.json();

    if (!resp.ok) {
      resultado.innerHTML = `<span class="erro">❌ ${dados.erro || 'Erro ao carregar.'}</span>`;
      return;
    }
    if (dados.length === 0) {
      resultado.innerHTML = '<span style="color:#9a9ba3;">Nenhum resultado ainda — precisa ter largada e chegada registradas.</span>';
      return;
    }

    window.__resultadosAtuais = dados; // guarda pra reusar quando trocar a categoria no seletor

    const categorias = [...new Set(dados.map(r => r.categoria_nome || 'Sem categoria'))];

    resultado.innerHTML = `
      <div style="display:flex; gap:16px; margin-top:16px;">
        <div style="flex:1; min-width:0;">
          <h2 style="font-size:14px; margin:0 0 10px; color:#e8a33d;">🏆 Geral</h2>
          <div id="colunaGeral"></div>
        </div>
        <div style="flex:1; min-width:0;">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <h2 style="font-size:14px; margin:0; color:#e8a33d;">📌 Categoria</h2>
            <select id="seletorCategoria" onchange="renderizarCategoriaSelecionada()" style="width:auto; padding:6px 8px; font-size:12px;">
              ${categorias.map(c => `<option value="${c}">${c}</option>`).join('')}
            </select>
          </div>
          <div id="colunaCategoria"></div>
        </div>
      </div>
    `;

    renderizarGeral(dados);
    renderizarCategoriaSelecionada();
  } catch (e) {
    resultado.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  }
}

function renderizarGeral(dados) {
  document.getElementById('colunaGeral').innerHTML = `
    <div style="max-height:400px; overflow-y:auto;">
      ${dados.map(r => `
        <div style="display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #362a41; font-size:12.5px;">
          <span>${r.posicao_geral}º ${r.nome}</span>
          <span style="color:#9a9ba3;">${r.tempo_total}</span>
        </div>
      `).join('')}
    </div>
  `;
}

function renderizarCategoriaSelecionada() {
  const dados = window.__resultadosAtuais || [];
  const categoriaEscolhida = document.getElementById('seletorCategoria').value;
  const filtrados = dados
    .filter(r => (r.categoria_nome || 'Sem categoria') === categoriaEscolhida)
    .sort((a, b) => a.posicao_categoria - b.posicao_categoria);

  document.getElementById('colunaCategoria').innerHTML = `
    <div style="max-height:400px; overflow-y:auto;">
      ${filtrados.map(r => `
        <div style="display:flex; justify-content:space-between; padding:8px 4px; border-bottom:1px solid #362a41; font-size:12.5px;">
          <span>${r.posicao_categoria}º ${r.nome}</span>
          <span style="color:#9a9ba3;">${r.tempo_total}</span>
        </div>
      `).join('')}
    </div>
  `;
}

// ============================================
// SIMULAR RFID (testes sem hardware)
// ============================================
let eventoSelecionadoSimular = null;

async function carregarEventosSimular() {
  const senha = document.getElementById('senhaSimular').value.trim();
  const container = document.getElementById('listaEventosSimular');
  if (!senha) {
    container.innerHTML = '<span class="erro">Preenche a senha.</span>';
    return;
  }
  container.textContent = 'Carregando...';

  try {
    const resp = await fetch('/admin/eventos/listar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha })
    });
    const eventos = await resp.json();
    if (!resp.ok) {
      container.innerHTML = `<span class="erro">❌ ${eventos.erro || 'Erro ao carregar.'}</span>`;
      return;
    }
    container.innerHTML = eventos.map(e => `
      <div class="evento-item" onclick="selecionarEventoSimular(${e.id}, this)">
        <div class="evento-nome">${e.nome}</div>
        <div class="evento-meta">${e.codigo} · ${e.total_pagos} pago(s)</div>
      </div>
    `).join('');
  } catch (e) {
    container.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  }
}

function selecionarEventoSimular(id, elemento) {
  eventoSelecionadoSimular = id;
  document.querySelectorAll('#listaEventosSimular .evento-item').forEach(el => el.classList.remove('selecionado'));
  elemento.classList.add('selecionado');
}

async function vincularTagSimulada() {
  const senha = document.getElementById('senhaSimular').value.trim();
  const inscricaoId = document.getElementById('inscricaoIdSimular').value.trim();
  const tag = document.getElementById('tagSimular').value.trim();
  const resultado = document.getElementById('resultadoSimular');

  if (!senha || !inscricaoId || !tag) {
    resultado.innerHTML = '<span class="erro">Preenche senha, nº do inscrito e código da tag.</span>';
    return;
  }

  try {
    const resp = await fetch(`/admin/inscricoes/${inscricaoId}/vincular-tag`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, tag_epc: tag })
    });
    const dados = await resp.json();
    if (resp.ok) {
      resultado.innerHTML = `<span class="ok">✅ Tag "${tag}" vinculada à inscrição #${inscricaoId}.</span>`;
    } else {
      resultado.innerHTML = `<span class="erro">❌ ${dados.erro || 'Não foi possível vincular.'}</span>`;
    }
  } catch (e) {
    resultado.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  }
}

async function simularLeitura() {
  const senha = document.getElementById('senhaSimular').value.trim();
  const tag = document.getElementById('tagLeituraSimular').value.trim();
  const modo = document.getElementById('modoSimular').value;
  const resultado = document.getElementById('resultadoSimular');

  if (!senha || !tag || !eventoSelecionadoSimular) {
    resultado.innerHTML = '<span class="erro">Preenche a senha, escolhe o evento na lista acima, e digita o código da tag.</span>';
    return;
  }

  try {
    const resp = await fetch(`/admin/eventos/${eventoSelecionadoSimular}/leitura-rfid`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ senha, tag_epc: tag, modo })
    });
    const dados = await resp.json();
    if (resp.ok) {
      resultado.innerHTML = `<span class="ok">✅ Leitura registrada: ${dados.nome} — ${modo} às ${new Date(dados.horario).toLocaleTimeString('pt-BR')}</span>`;
    } else {
      resultado.innerHTML = `<span class="erro">❌ ${dados.erro || 'Não foi possível registrar a leitura.'}</span>`;
    }
  } catch (e) {
    resultado.innerHTML = '<span class="erro">❌ Erro de conexão com o servidor.</span>';
  }
}
